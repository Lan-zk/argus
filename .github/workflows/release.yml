name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  build:
    needs: test
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon(.dmg)
          - platform: macos-latest
            args: --target aarch64-apple-darwin --bundles app,dmg
            rust-targets: aarch64-apple-darwin
          # macOS Intel(.dmg)
          - platform: macos-latest
            args: --target x86_64-apple-darwin --bundles app,dmg
            rust-targets: x86_64-apple-darwin
          # Windows x64(NSIS 安装包 .exe + MSI)
          - platform: windows-latest
            args: --bundles nsis,msi
            rust-targets: ''
          # Linux(.deb + .AppImage)
          - platform: ubuntu-22.04
            args: --bundles deb,appimage
            rust-targets: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload to Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 更新包 minisign 签名（spec: app-updates）——私钥来自 GitHub secrets，缺失时 updater 产物构建失败（有意：不出无签名更新包）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Argus v__VERSION__'
          releaseBody: '在下方 Assets 中下载对应系统的安装包。'
          # 草稿发布 = 更新对外开关（spec: app-updates 更新源与发布可见性）：手动 Publish 后 latest.json 才可匿名下载
          releaseDraft: true
          prerelease: false
          # 同时产出 NSIS/MSI 时 latest.json 指向 NSIS（MSI 不在自动更新覆盖范围）
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
